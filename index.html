<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex,nofollow">
<title>思尔忆汝，魂牵梦萦</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:#ffe;color:#231f20;overflow:hidden;
  -webkit-text-size-adjust:100%;text-size-adjust:100%;
  font-family:"微软雅黑","Microsoft YaHei","PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif;
  display:grid;place-items:center;
}

/* ---------------- 入场：点一下心，时间线从 0 开始 ---------------- */
#gate{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none}
.gate{
  position:fixed;inset:0;z-index:30;display:grid;place-items:center;cursor:pointer;
  -webkit-tap-highlight-color:transparent;user-select:none;
  background:radial-gradient(circle at 50% 40%,#fffef9 0%,#fdf2de 45%,#f3e2cb 100%);
  transition:opacity .85s ease,transform 1.1s cubic-bezier(.4,0,.2,1),visibility .85s;
}
.gate-in{text-align:center;transition:opacity .45s ease}
.gate-heart{width:92px;display:block;margin:0 auto 24px;animation:beat 1.7s ease-in-out infinite;
  filter:drop-shadow(0 8px 18px rgba(193,18,31,.25))}
@keyframes beat{0%,100%{transform:scale(1)}28%{transform:scale(1.09)}50%{transform:scale(.97)}}
.gate h1{font-size:21px;font-weight:400;letter-spacing:.32em;color:#9c2b2b;margin-bottom:15px}
.gate .tip{font-size:13px;letter-spacing:.2em;color:#b09a8a}
.gate .tip b{font-weight:400;color:#c1121f}
#gate:checked ~ .gate{opacity:0;visibility:hidden;transform:scale(1.22)}
#gate:checked ~ .gate .gate-in{opacity:0}

/* ---------------- 访问密码：纯 CSS 校验，零 JS ---------------- */
#pw{
  position:fixed;left:50%;top:calc(50% - 24px);transform:translateX(-50%);z-index:41;
  width:224px;padding:13px 14px;font-family:inherit;font-size:16px;color:#231f20;
  letter-spacing:.32em;text-indent:.32em;text-align:center;
  background:#fffdf5;border:1px solid #e3cfb4;border-radius:10px;
  outline:none;-webkit-appearance:none;appearance:none;
  transition:border-color .25s,box-shadow .25s;
}
#pw::placeholder{font-size:13px;letter-spacing:.1em;text-indent:.1em;color:#c4b2a0}
#pw:focus{border-color:#c1121f;box-shadow:0 0 0 3px rgba(193,18,31,.13)}
#pw:not(:placeholder-shown):invalid{border-color:#c1121f;animation:pwshake .34s ease}
@keyframes pwshake{
  0%,100%{transform:translateX(-50%)}
  25%{transform:translateX(calc(-50% - 5px))}
  75%{transform:translateX(calc(-50% + 5px))}
}
#pwwrap{
  position:fixed;inset:0;z-index:39;
  background:radial-gradient(circle at 50% 40%,#fffef9 0%,#fdf2de 45%,#f3e2cb 100%);
  transition:opacity .7s ease,visibility .7s;
}
.pw-head,.pw-foot{
  position:fixed;left:50%;transform:translateX(-50%);z-index:41;width:100%;
  text-align:center;pointer-events:none;
  transition:opacity .7s ease,visibility .7s;
}
.pw-head{top:calc(50% - 172px)}
.pw-foot{top:calc(50% + 40px)}
.pw-head svg{width:54px;display:block;margin:0 auto 18px;animation:beat 1.7s ease-in-out infinite}
.pw-head h1{font-size:20px;font-weight:400;letter-spacing:.3em;color:#9c2b2b}
.pw-err{height:20px;font-size:12px;letter-spacing:.12em;color:#c1121f;opacity:0;transition:opacity .25s}
#pw:not(:placeholder-shown):invalid ~ .pw-foot .pw-err{opacity:1}
.pw-foot .tip2{font-size:12px;letter-spacing:.14em;color:#b09a8a}
#pw:valid,
#pw:valid ~ #pwwrap,
#pw:valid ~ .pw-head,
#pw:valid ~ .pw-foot{opacity:0;visibility:hidden;pointer-events:none}

/* ---------------- 舞台：等比缩放 ---------------- */
#stage{
  position:relative;
  width:100vw;height:61.8vw;                     /* 老内核兜底 */
  width:min(100vw, calc(100vh * 1.6176471));
  height:min(calc(100vw / 1.6176471), 100vh);
  container-type:size;
  opacity:0;
}
#gate:checked ~ #stage{opacity:1}
#stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}

/* ---------------- 情书：逐行打字机 ---------------- */
#text{
  position:absolute;left:4.8%;top:10.4%;width:44%;
  font-size:14px;font-size:1.34cqw;line-height:2.34;
  color:#d21c2a;letter-spacing:.01em;
  text-shadow:0 0 4px rgba(255,253,240,.95),0 0 1px rgba(255,253,240,.95);
}
.ln{display:block;width:max-content;white-space:nowrap;
  clip-path:inset(-8% 100% -8% 0);
  animation:reveal .95s steps(19) both;}
@keyframes reveal{from{clip-path:inset(-8% 100% -8% 0)}to{clip-path:inset(-8% 0 -8% 0)}}
.sig{margin-left:26%;letter-spacing:.1em;color:#c1121f}

/* ---------------- 计时 ---------------- */
@property --sec{syntax:'<integer>';inherits:false;initial-value:0}
#clock-box{
  position:absolute;left:5.2%;top:78.5%;
  font-size:14px;font-size:1.28cqw;letter-spacing:.12em;color:#7d7168;opacity:0;
}
#gate:checked ~ #stage #clock-box{animation:showIn .9s ease 8.9s both}
@keyframes showIn{from{opacity:0}to{opacity:1}}
#clock{margin-top:.45em;font-size:19px;font-size:1.72cqw;letter-spacing:.03em;
  color:#3f7f43;white-space:nowrap}
#clock .digit{font-size:26px;font-size:2.42cqw;font-weight:600;color:#2f7d32}
#clock .sec{counter-reset:sec var(--sec)}
#clock .sec::before{content:counter(sec,decimal-leading-zero)}
#clock .sec{animation:tick 60s steps(60) infinite 9.2s;animation-play-state:paused}
#gate:checked ~ #stage #clock .sec{animation-play-state:running}
@keyframes tick{from{--sec:0}to{--sec:60}}

/* ---------------- 动画总闸：点击前全部静止 ---------------- */
#stage .an{animation-play-state:paused}
#gate:checked ~ #stage .an{animation-play-state:running}

/* ---------------- SVG 动画 ---------------- */
use,rect,g#heart{transform-box:fill-box;transform-origin:50% 50%}

.seedheart{animation:seedLife 2.45s ease-in .05s both}
@keyframes seedLife{
  0%{transform:translate(0,0) scale(1.14);opacity:0}
  9%{transform:translate(0,0) scale(1);opacity:1}
  24%{transform:translate(0,0) scale(.22);opacity:1}
  88%{transform:translate(0,330px) scale(.22);opacity:1}
  100%{transform:translate(0,368px) scale(.1);opacity:0}
}

.footline{animation:spread 1.75s cubic-bezier(.15,.75,.35,1) .45s both}
@keyframes spread{from{transform:scaleX(0)}to{transform:scaleX(1)}}

.dot{animation:dotIn .12s linear both}
@keyframes dotIn{from{opacity:0}to{opacity:1}}

.bloom{
  animation-name:pop,fadeIn;
  animation-duration:.9s,.45s;
  animation-timing-function:cubic-bezier(.34,1.45,.64,1),linear;
  animation-fill-mode:both,both;
}
@keyframes pop{from{transform:scale(.08)}to{transform:scale(1)}}
@keyframes fadeIn{from{opacity:0}}

#heart{will-change:transform;animation:heartbeat 3.4s ease-in-out 8.6s infinite both}
@keyframes heartbeat{0%,100%{transform:scale(1)}18%{transform:scale(1.02)}34%{transform:scale(.996)}52%{transform:scale(1.012)}}

.fl{animation:rise 7.5s linear infinite both}
@keyframes rise{
  0%{transform:translateY(0) scale(.5);opacity:0}
  12%{opacity:.92}
  100%{transform:translateY(-500px) scale(1.05);opacity:0}
}

/* ---------------- 音乐（已移除，不再内嵌 mp3） ---------------- */

/* ---------------- 竖屏：场景在上，情书在下 ---------------- */
/* #stage 有 contain:layout，fixed 子元素会被它当包含块，所以这里必须用 absolute */
@media (max-aspect-ratio:1/1){
  body{place-items:start center;padding-top:5vh}
  #text{position:absolute;left:6vw;top:calc(61.8vw + 4vh);width:88vw;
    font-size:3.4vw;line-height:1.95}
  #clock-box{position:absolute;left:6vw;top:calc(61.8vw + 4vh + 74vw);
    font-size:3.1vw;letter-spacing:.1em}
  #clock{font-size:3.6vw;margin-top:.5em}
  #clock .digit{font-size:4.8vw}
}
</style>
</head>

  <div id="text"><span class="ln an" style="animation-delay:8.55s">女君，遇见你，是我这一生最幸运的事。</span><span class="ln an" style="animation-delay:9.41s">忘不了和你在一起的点点滴滴，刻骨铭心。</span><span class="ln an" style="animation-delay:10.27s">忘不了你干净的脸，肆无忌惮的牙龈。</span><span class="ln an" style="animation-delay:11.13s">还记得那些幻想吗?只愿意和特定的你完成的憧憬。</span><span class="ln an" style="animation-delay:11.99s">你说，我说着听起来好浪漫。</span><span class="ln an" style="animation-delay:12.85s">多么希望有一天可以和你一件件的去实现。</span><span class="ln an" style="animation-delay:13.71s">你说，我是最会说情话的情郎。</span><span class="ln an" style="animation-delay:14.57s">其实我只是说出了内心不加修饰的话，没有吹牛。</span><span class="ln an" style="animation-delay:15.43s">多么希望能成为你一辈子的生命之光，灵魂伴侣。</span><span class="ln an" style="animation-delay:16.29s">我会一直做你的弗洛伦蒂诺·阿里萨，等着你。</span><span class="ln sig an" style="animation-delay:17.15s">—— 木易黄黄 ——</span></div>
